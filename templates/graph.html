<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<title>Connections | Personal journal</title>
<style>
:root{--paper:#f5f8fc;--ink:#173145;--blue:#285b86;--quiet:#566c7d;--line:#ccdae5;--green:#266859;--selected:#deecf5}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:28px 34px 20px;border-bottom:1px solid var(--line);display:flex;gap:24px;align-items:baseline;justify-content:space-between}h1{font:normal 38px/1.15 Georgia,serif;margin:0}header p{margin:8px 0;color:var(--quiet);max-width:62ch}a{color:var(--blue)}main{display:grid;grid-template-columns:280px minmax(350px,1fr) minmax(290px,380px);min-height:calc(100vh - 145px)}nav{padding:24px 18px;border-right:1px solid var(--line)}label{display:block;margin-bottom:8px;font-weight:600}input{width:100%;padding:12px;border:1px solid #7c96ab;background:white;color:var(--ink);font:inherit;border-radius:5px}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #357eb2;outline-offset:3px}#list{margin-top:16px;display:flex;flex-direction:column;gap:4px;max-height:72vh;overflow:auto}#list button{border:0;background:transparent;padding:10px;text-align:left;border-radius:4px}#list button:hover,#list button[aria-pressed=true]{background:var(--selected)}small{display:block;color:var(--quiet);font-size:12px;overflow-wrap:anywhere}.map{padding:18px;min-width:0}svg{width:100%;height:540px;overflow:visible}svg text{font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:var(--ink)}svg .edge{stroke:#9eb5c6;stroke-width:1.2}svg .node{cursor:pointer}svg .node circle{fill:white;stroke:var(--blue);stroke-width:2}svg .node.selected circle{fill:var(--blue)}svg .edge-label{fill:var(--quiet);font-size:10px}aside{padding:24px;border-left:1px solid var(--line);background:#fff;overflow-wrap:anywhere}h2{font:normal 26px/1.3 Georgia,serif;margin:0 0 12px}h3{font-size:16px;margin-top:26px}#passage{white-space:pre-wrap;font:15px/1.65 Georgia,serif;max-height:48vh;overflow:auto;padding-right:8px}.connection{border-top:1px solid var(--line);padding:12px 0}.connection button{border:0;padding:0;background:none;color:var(--blue);text-align:left}.evidence{white-space:pre-wrap;font-family:Georgia,serif;margin:8px 0;color:var(--ink)}.hint{color:var(--quiet);font-size:14px}.empty{padding:24px 0}.stamp{white-space:nowrap;font-size:13px;color:var(--quiet)}@media(max-width:1100px){main{grid-template-columns:240px 1fr}aside{grid-column:1/-1;border-top:1px solid var(--line)}#passage{max-height:360px}}@media(max-width:650px){header{display:block;padding:22px}h1{font-size:32px}main{display:block}nav{border-right:0;padding:18px}#list{max-height:180px}.map{padding:12px}svg{height:420px}aside{padding:22px}}
</style>
<header><div><h1>Connections</h1><p>Follow a thought back to its source. See what connects, who said it, and what changed.</p></div><span class="stamp" id="stamp"></span></header>
<main><nav aria-label="Find a record"><label for="query">Find a person, project, or passage</label><input id="query" type="search" placeholder="Search your records" autocomplete="off"><div id="list"></div><p class="hint" id="count"></p></nav><section class="map" aria-label="Connected records"><svg id="map" viewBox="0 0 620 540" role="img" aria-label="Connections to the selected record"></svg><p class="hint">Select a record to explore its immediate connections. Document links show references; they do not establish agreement.</p></section><aside aria-live="polite"><h2 id="title">Choose a record</h2><p id="meta" class="hint"></p><a id="open" hidden>Open original file</a><h3>Source passage</h3><div id="passage"></div><h3>Connected evidence</h3><div id="connections"></div></aside></main>
<script>
'use strict';
const DATA=__VAULT_DATA__;
const nodes=new Map(DATA.nodes.map(n=>[n.id,n]));
const el=id=>document.getElementById(id);let selected;
const svgNS='http://www.w3.org/2000/svg';
function svg(tag,attrs,text){const e=document.createElementNS(svgNS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;return e}
function label(n){return n.title||n.id}
function list(){const q=el('query').value.toLowerCase();const matches=DATA.nodes.filter(n=>(label(n)+' '+(n.path||'')+' '+(n.text||'')).toLowerCase().includes(q)).sort((a,b)=>(Date.parse(b.recorded_at)||0)-(Date.parse(a.recorded_at)||0));el('list').replaceChildren();for(const n of matches.slice(0,35)){const b=document.createElement('button');b.type='button';b.textContent=label(n);b.setAttribute('aria-pressed',n.id===selected?'true':'false');const s=document.createElement('small');s.textContent=n.kind+(n.recorded_at?' / '+n.recorded_at.slice(0,10):'');b.append(s);b.onclick=()=>choose(n.id);el('list').append(b)}el('count').textContent=matches.length+' matching records'+(matches.length>35?'; showing the first 35':'');}
function choose(id){selected=id;const n=nodes.get(id);if(!n)return;list();el('title').textContent=label(n);el('meta').textContent=[n.speaker?('Author: '+n.speaker):'',n.kind,n.recorded_at?('Recorded '+n.recorded_at):'',n.occurred_on?('Event '+n.occurred_on):'',n.as_of?('As of '+n.as_of):'',n.legacy?'Legacy document: attribution and present-day relevance need checking.':''].filter(Boolean).join(' · ');el('passage').textContent=n.text||'This is a connection point. Follow a source record to read the evidence.';el('open').hidden=!n.path;if(n.path)el('open').href='../'+n.path.split('/').map(encodeURIComponent).join('/');const edges=DATA.edges.filter(e=>e.source===id||e.target===id);el('connections').replaceChildren();if(!edges.length)el('connections').textContent='No explicit links yet. The source remains searchable.';for(const e of edges.slice(0,60)){const other=nodes.get(e.source===id?e.target:e.source);if(!other)continue;const d=document.createElement('div');d.className='connection';const b=document.createElement('button');b.textContent=e.relation.replaceAll('_',' ')+' / '+label(other);b.onclick=()=>choose(other.id);d.append(b);const s=document.createElement('small');s.textContent=e.provenance;d.append(s);if(e.evidence){const p=document.createElement('p');p.className='evidence';p.textContent=e.evidence;d.append(p)}el('connections').append(d)}draw(n,edges)}
function draw(center,edges){const canvas=el('map');canvas.replaceChildren();const neighbours=[...new Set(edges.map(e=>e.source===center.id?e.target:e.source))].filter(id=>id!==center.id&&nodes.has(id)).slice(0,14);const pos=new Map([[center.id,[310,270]]]);neighbours.forEach((id,i)=>{const angle=(Math.PI*2*i/Math.max(neighbours.length,1))-Math.PI/2;pos.set(id,[310+228*Math.cos(angle),270+212*Math.sin(angle)])});for(const id of neighbours){const [x,y]=pos.get(id);canvas.append(svg('line',{x1:310,y1:270,x2:x,y2:y,class:'edge'}));const e=edges.find(e=>e.source===id||e.target===id);canvas.append(svg('text',{x:(x+310)/2,y:(y+270)/2-5,'text-anchor':'middle',class:'edge-label'},e.relation.replaceAll('_',' ')))}for(const[id,[x,y]]of pos){const n=nodes.get(id),g=svg('g',{class:'node'+(id===center.id?' selected':''),role:'button',tabindex:'0','aria-label':label(n)});g.append(svg('circle',{cx:x,cy:y,r:id===center.id?15:9}));const name=label(n);g.append(svg('text',{x,y:y+29,'text-anchor':'middle'},name.length>31?name.slice(0,28)+'…':name));g.addEventListener('click',()=>choose(id));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(id)}});canvas.append(g)}}
el('query').addEventListener('input',list);el('stamp').textContent='Updated '+DATA.built_at.slice(0,10);list();const first=[...DATA.nodes].filter(n=>n.kind==='user_statement').sort((a,b)=>Date.parse(b.recorded_at)-Date.parse(a.recorded_at))[0]||DATA.nodes[0];if(first)choose(first.id);
</script>
</html>
