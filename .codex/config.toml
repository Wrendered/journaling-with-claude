# OpenAI Codex CLI project config
# Docs: https://developers.openai.com/codex/config-reference
#
# This file is the project-level Codex config. User-level overrides go in
# ~/.codex/config.toml.

[features]
# Required to enable hooks declared in .codex/hooks.json
codex_hooks = true

# Subagents directory (.codex/agents/*.toml). Default depth is 1.
[agents]
max_depth = 1

# MCP servers
[mcp_servers.todoist]
url = "https://ai.todoist.net/mcp"
